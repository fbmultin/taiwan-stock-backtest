<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>台股回測比較</title>

    <!-- PWA:可加到主畫面、全螢幕獨立運作 -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/favicon-64.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="theme-color" content="#059669" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="台股持股" />

    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Identity Services:用於「我的持股」頁面的 Google 登入按鈕,
         跟 Firebase 本身的 signInWithPopup/signInWithRedirect 是不同機制,
         由 Google 官方直接處理,不依賴跨網域(本站 vs firebaseapp.com)的
         瀏覽器儲存空間,手機瀏覽器相容性比較好。 -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script>
      // 字體放大：在不超出欄位/容器寬度的前提下盡量放大具名的 Tailwind 字級，
      // 高度(行高)可視需要一併加大；任意值的 text-[Npx] 類別改在 src/App.js 內直接調整數值。
      tailwind.config = {
        theme: {
          extend: {
            fontSize: {
              xs: ['14.5px', { lineHeight: '20px' }], // 12px -> 14.5px
              sm: ['16.5px', { lineHeight: '22px' }], // 14px -> 16.5px
              lg: ['21px', { lineHeight: '28px' }], // 18px -> 21px
              xl: ['23px', { lineHeight: '29px' }], // 20px -> 23px
              '2xl': ['27px', { lineHeight: '32px' }], // 24px -> 27px
              '3xl': ['35px', { lineHeight: '40px' }], // 30px -> 35px
              '4xl': ['42px', { lineHeight: '46px' }], // 36px -> 42px
            },
          },
        },
      };
    </script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
