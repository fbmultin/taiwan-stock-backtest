<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>台股回測比較</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // 字體放大：在不超出欄位/容器寬度的前提下盡量放大具名的 Tailwind 字級，
      // 高度(行高)可視需要一併加大；任意值的 text-[Npx] 類別改在 src/App.js 內直接調整數值。
      tailwind.config = {
        theme: {
          extend: {
            fontSize: {
              xs: ['14.5px', { lineHeight: '20px' }], // 12px -> 14.5px
              sm: ['16.5px', { lineHeight: '22px' }], // 14px -> 16.5px
              lg: ['21px', { lineHeight: '28px' }], // 18px -> 21px
              xl: ['23px', { lineHeight: '29px' }], // 20px -> 23px
              '2xl': ['27px', { lineHeight: '32px' }], // 24px -> 27px
              '3xl': ['35px', { lineHeight: '40px' }], // 30px -> 35px
              '4xl': ['42px', { lineHeight: '46px' }], // 36px -> 42px
            },
          },
        },
      };
    </script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
